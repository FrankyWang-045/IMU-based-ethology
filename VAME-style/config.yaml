# IMU Pose-VAE 行为分析管线配置

project:
  name: imu_pose_vae
  raw_dir: Test_File              # 原始 csv 文件夹
  output_dir: output              # 所有产物的根目录

preprocess:
  gyro_unit: deg                  # 角速度单位，Madgwick 会转成 rad
  madgwick_beta: 0.1

dataset:
  chunk: 1000                     # 训练块长（帧）
  val_files: []                   # 按文件划分验证集：填文件名（不含扩展名）
                                  # 例: ["A6_C3_C3-c2"]；空列表 = 全部用于训练

model:
  in_features: 5
  z_dim: 6
  channels: [32, 64, 64]
  kernel_size: 9                  # 感受野 = 1 + 3×(9-1) = 25 帧

train:
  batch_size: 32
  epochs: 100
  lr: 0.001
  kl_beta: 0.1
  seed: 0

hmm:
  n_states: 6
  n_seeds: 10
  n_iter: 100
  covariance_type: diag