# IMU Pose-VAE 行为分析管线配置
project:
  name: imu_pose_vae
  raw_dir: F:\IMU_computational_ethology\Data\VAME-Style-Data\容量测试\n=14              # 原始 csv 文件夹
  output_dir: F:\IMU_computational_ethology\Data\VAME-Style-Data\容量测试\n=14           # 所有产物的根目录

preprocess:
  lowpass_cutoff: 12.5      # 或 25.0
  lowpass_order: 4
  target_fs: 25
  use_gravity_align: true
  stationary_window_sec: 2.0
  gravity_target: [0.0, 0.0, 1.0]
  flip_xz_recordings: []    # 需要翻转的 recording 列表

dataset:
  chunk: 2048
  val_files: []

model:
  in_features: 6
  z_dim: 9
  decoder_hidden: [64, 128]
  pad_mode: "replicate"
  branches:
    - name: slow
      z_dim: 3
      channels: [32, 64, 64, 64]
      kernel_sizes: [33, 33, 33, 32]
    - name: fast
      z_dim: 6
      channels: [32, 64, 64]
      kernel_sizes: [5, 5, 6]
    

train:
  batch_size: 32
  epochs: 100
  lr: 0.001
  seed: 0
  slow_lowpass_cutoff: 2.0
  rec_weights: {slow: 1.0, fast: 1.0}
  kl_betas: {slow: 1.0e-3, fast: 1.0e-4}
  kl_ramp_epochs: {slow: 10, fast: 30}
  grad_clip: 1.0

  augment:
    enabled: false
    max_angle_deg: 5.0
    prob: 1.0


hmm:
  n_states: 55
  hsmm_sticky_beta: 0.0001
  min_duration_frames: 5
  hsmm_d_max_sec: 20
  hsmm_train_frames: 10000
  hsmm_n_iter: 20
  hsmm_n_init: 10
  hsmm_seed: 0

  # 分段训练参数（写这几个就启用分段模式）
  hsmm_train_segments_per_round: 20   # 每轮抽 10 段
  hsmm_segment_length: 10000           # 每段 1000 帧（25Hz 下 40 秒）
  hsmm_n_rounds: 30                   # 共 30 轮

hmm_scan:
  k_list: [19, 21, 23, 25, 27, 29, 31, 33, 35, 37, 39, 41, 43, 45, 47, 49, 51, 53, 55, 57, 59, 61, 63, 65, 67, 69, 71, 73, 75, 77]
  hsmm_scan_n_iter: 10
  hsmm_scan_segment_length: 1000
  hsmm_scan_n_segments: 10
  hsmm_scan_seed: 0
  hsmm_scan_n_init: 10
